name: Pinned Windows toolchain
description: Select the repository Node, pnpm and Rust versions without restoring dependency caches.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Install pinned pnpm and Rust
      shell: pwsh
      run: ./scripts/ci/toolchain.ps1
