<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" role="img" aria-label="components 匿名排版结构示意"><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif}*{vector-effect:non-scaling-stroke}</style><rect x="0" y="0" width="1500" height="1050" rx="0" fill="#f7f7fe" stroke="none"/><text x="85" y="95" fill="#333644" font-size="36" font-weight="500">通用控件与反馈</text><rect x="85" y="143" width="190" height="34" rx="17" fill="#eeedff" stroke="none"/><text x="97" y="166" fill="#5867f5" font-size="17" font-weight="500">主要按钮</text><rect x="310" y="143" width="220" height="40" rx="15" fill="#ffffff" stroke="#dfe2ea"/><text x="328" y="170" fill="#333644" font-size="20" font-weight="500">次要按钮</text><rect x="570" y="143" width="330" height="40" rx="15" fill="#ffffff" stroke="#dfe2ea"/><text x="588" y="170" fill="#747987" font-size="20" font-weight="500">输入 / 下拉</text><rect x="85" y="264" width="440" height="360" rx="15" fill="#ffffff" stroke="#dfe2ea"/><text x="110" y="308" fill="#333644" font-size="26" font-weight="500">通用表单弹窗</text><rect x="110" y="350" width="386" height="6" rx="3" fill="#dce0e9" stroke="none"/><rect x="110" y="385" width="386" height="6" rx="3" fill="#dce0e9" stroke="none"/><rect x="110" y="420" width="386" height="6" rx="3" fill="#dce0e9" stroke="none"/><rect x="110" y="455" width="270.2" height="6" rx="3" fill="#dce0e9" stroke="none"/><rect x="330" y="566" width="165" height="34" rx="17" fill="#eeedff" stroke="none"/><text x="342" y="589" fill="#5867f5" font-size="17" font-weight="500">保存</text><text x="85" y="670" fill="#5867f5" font-size="24" font-weight="500">弹窗规格：380 / 440 / 480 / 600 / 760 / 1180</text><rect x="620" y="264" width="600" height="140" rx="15" fill="#ffffff" stroke="#dfe2ea"/><rect x="640" y="288" width="50" height="50" rx="12" fill="#eeedff" stroke="#dfe2ea"/><text x="708" y="309" fill="#333644" font-size="23" font-weight="500">提示标题</text><text x="708" y="345" fill="#747987" font-size="20" font-weight="500">简短信息，必要时提供下一步</t